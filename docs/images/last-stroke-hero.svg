<text x="82" y="96" font-family="IBM Plex Mono,monospace" font-size="14" letter-spacing="6" fill="#b23a2b">墨  /  AN INK-BORN SURVIVAL</text>
<text x="81" y="220" font-family="Georgia,'Zen Antique',serif" font-size="124" fill="#1a1714" letter-spacing="-5">ONE MORE.</text>
<text x="86" y="279" font-family="IBM Plex Mono,monospace" font-size="23" fill="#554c40" letter-spacing="9">THE LAST STROKE</text>
<path d="M88 321Q327 310 480 319T804 311" fill="none" stroke="#1a1714" stroke-width="7" opacity=".75"/>
<text x="87" y="373" font-family="Georgia,'Zen Antique',serif" font-size="22" fill="#1a1714">Before the brush can fight, it must remember why.</text>
