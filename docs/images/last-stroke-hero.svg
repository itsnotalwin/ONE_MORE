<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">ONE MORE: The Last Stroke, illustrated story title card</title>
<desc id="desc">Original SVG illustration, not a gameplay screenshot: dark sumi-ink mountains on washi, a brush-spirit and restrained vermilion seal beneath a Japanese-inspired typographic title.</desc>
