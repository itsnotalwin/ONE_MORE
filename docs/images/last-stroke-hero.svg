<text x="86" y="679" font-family="IBM Plex Mono,monospace" font-size="13" fill="#1a1714" letter-spacing="4">THREE SCROLLS  /  TEN LEVELS EACH  /  THE PAPER NEVER ENDS</text>
<text x="1355" y="679" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="12" fill="#b23a2b" letter-spacing="3">STORY EXPERIMENT 001</text>
