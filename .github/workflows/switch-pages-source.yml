name: Point live Pages at development

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/switch-pages-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  switch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages publishing source to development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/pages-response \
            --write-out '%{http_code}' \
            --data '{"source":{"branch":"development","path":"/"},"build_type":"legacy"}' \
            "https://api.github.com/repos/itsnotalwin/ONE_MORE/pages")
          if [ "$status" != "204" ]; then
            echo "Pages source update failed with HTTP $status"
            cat /tmp/pages-response
            exit 1
          fi
          echo "Pages publishing source updated to development / (root)."
