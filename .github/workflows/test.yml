name: Verify campaign and visual contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free regression suite
        run: node --test tests/*.test.cjs
